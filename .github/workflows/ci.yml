name: Threat Intelligence Platform CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  backend-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API Gateway dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api-gateway/requirements.txt

      - name: Check Python files
        run: |
          python -m compileall services/api-gateway/app
          python -m compileall services/analysis-service
          python -m compileall services/alert-service

  frontend-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build React frontend
        working-directory: frontend
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs:
      - backend-check
      - frontend-check

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build API Gateway image
        run: docker build -t threat-api-gateway ./services/api-gateway

      - name: Build Analysis Service image
        run: docker build -t threat-analysis-service ./services/analysis-service

      - name: Build Alert Service image
        run: docker build -t threat-alert-service ./services/alert-service

      - name: Build Frontend image
        run: docker build -t threat-frontend ./frontend