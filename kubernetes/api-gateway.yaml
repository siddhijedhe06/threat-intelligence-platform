apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: threat-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: ghcr.io/siddhijedhe06/threat-api-gateway:latest
          ports:
            - containerPort: 8000
          env:
          - name: DB_HOST
            value: host.docker.internal

          - name: DB_USER
            valueFrom:
            secretKeyRef:
            name: mysql-secret
            key: DB_USER

          - name: DB_PASSWORD
            valueFrom:
            secretKeyRef:
            name: mysql-secret
            key: DB_PASSWORD

          - name: DB_NAME
            valueFrom:
            secretKeyRef:
            name: mysql-secret
            key: DB_NAME
          
          - name: ANALYSIS_SERVICE_URL
            valueFrom:
            configMapKeyRef:
            name: threat-platform-config
            key: ANALYSIS_SERVICE_URL
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: threat-platform
spec:
  selector:
    app: api-gateway
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: NodePort

