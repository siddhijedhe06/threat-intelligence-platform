apiVersion: apps/v1
kind: Deployment
metadata:
  name: analysis-service
  namespace: threat-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analysis-service
  template:
    metadata:
      labels:
        app: analysis-service
    spec:
      containers:
        - name: analysis-service
          image: ghcr.io/siddhijedhe06/threat-analysis-service:latest
          ports:
            - containerPort: 8001
          env:
        - name: DB_HOST
          value: host.docker.internal

        - name: DB_USER
          valueFrom:
          secretKeyRef:
          name: mysql-secret
          key: DB_USER

        - name: DB_PASSWORD
          valueFrom:
          secretKeyRef:
          name: mysql-secret
          key: DB_PASSWORD

        - name: DB_NAME
          valueFrom:
          secretKeyRef:
          name: mysql-secret
          key: DB_NAME
        
        - name: ALERT_SERVICE_URL
          valueFrom:
          configMapKeyRef:
          name: threat-platform-config
          key: ALERT_SERVICE_URL
---
apiVersion: v1
kind: Service
metadata:
  name: analysis-service
  namespace: threat-platform
spec:
  selector:
    app: analysis-service
  ports:
    - protocol: TCP
      port: 8001
      targetPort: 8001